<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>THS Admin</title><link rel="icon" href="favicon.png">
<style>
*{box-sizing:border-box}body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f1f5f9;margin:0}
header{background:#0f172a;color:#fff;padding:14px 20px;display:flex;justify-content:space-between}
.wrap{max-width:760px;margin:16px auto;padding:0 12px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
input{padding:11px;border:1px solid #cbd5e1;border-radius:9px;width:100%}button,.wa{padding:9px 14px;border:0;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin:8px 6px 0 0}
.badge{padding:2px 10px;border-radius:99px;color:#fff;font-weight:800;font-size:.75rem}p{margin:4px 0}
</style></head><body><header><b>THS Admin – Orders</b><span id="cnt"></span></header>
<div class="wrap"><div class="card" id="login"><b>Admin Password</b><br><br><input id="pw" type="password"><br><br><button style="background:#0369a1" onclick="go()">Login</button><p id="e" style="color:#be123c"></p></div><div id="list"></div></div>
<script>
let K=sessionStorage.getItem('k')||'';const $=i=>document.getElementById(i),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(m,b){const r=await fetch('/api/orders',{method:m,headers:{'Content-Type':'application/json','x-admin-key':K},body:b?JSON.stringify(b):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error);return d}
async function go(){K=$('pw').value||K;try{await load();sessionStorage.setItem('k',K);$('login').style.display='none';setInterval(load,20000)}catch(x){$('e').textContent=x.message}}
async function load(){const{orders}=await api('GET');const p=orders.filter(o=>o.status==='pending').length;$('cnt').textContent=p+' pending';

 const c={pending:'#f59e0b',confirmed:'#16a34a',cancelled:'#dc2626'};
 $('list').innerHTML=orders.map(o=>`<div class="card"><span class="badge" style="background:${c[o.status]}">${o.status.toUpperCase()}</span> <b>${o.id}</b> <small>${new Date(o.createdAt).toLocaleString()}</small>
 <p><b>${esc(o.name)}</b> – <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></p><p>${esc(o.city)}, ${esc(o.address)}</p>
 <p>Service: <b>${esc(o.service)}</b> ${esc(o.capacity)} | Date: ${esc(o.date)||'-'}</p><p>${esc(o.details)}</p>${o.note?'<p><i>Note: '+esc(o.note)+'</i></p>':''}
 ${o.status==='pending'?`<button style="background:#16a34a" onclick="act('${o.id}','confirmed')">Confirm</button><button style="background:#dc2626" onclick="act('${o.id}','cancelled')">Cancel</button>`:''}
 <a class="wa" style="background:#25d366" target="_blank" href="https://wa.me/92${o.phone.replace(/\D/g,'').replace(/^(92|0)/,'')}?text=${encodeURIComponent('Hello '+o.name+', your THS order '+o.id+' is '+o.status.toUpperCase()+'.')}">WhatsApp</a></div>`).join('')||'<div class="card">No orders yet.</div>'}
async function act(id,status){const note=prompt(status==='confirmed'?'Optional note for customer (e.g. visit date):':'Reason for cancellation (optional):');if(note===null)return;await api('PATCH',{id,status,note});load()}
if(K)go();
</script></body></html>
