<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Place Order | THS</title><link rel="icon" href="favicon.png">
<style>
*{box-sizing:border-box}body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f1f5f9;margin:0;color:#0f172a}
header{background:#0369a1;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;text-decoration:none;font-weight:700}
.wrap{max-width:560px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
h2{margin:0 0 12px}label{display:block;font-weight:700;font-size:.85rem;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}
button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:#65a30d;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}button:disabled{opacity:.6}
.msg{margin-top:12px;padding:10px;border-radius:8px;display:none;font-weight:600}.ok{background:#ecfccb;color:#3f6212;display:block}.err{background:#fff1f2;color:#be123c;display:block}
.hp{position:absolute;left:-9999px}.badge{display:inline-block;padding:3px 10px;border-radius:99px;color:#fff;font-weight:800}
</style></head><body>
<header><b>THS Orders</b><a href="index.html">← Back to website</a></header>
<div class="wrap">
<div class="card"><h2>Place Your Order</h2>
<form id="f"><input class="hp" name="_honey" tabindex="-1" autocomplete="off">
<label>Full Name *</label><input name="name" required>
<label>Phone *</label><input name="phone" type="tel" placeholder="03XXXXXXXXX" required>
<label>Email (for confirmation updates)</label><input name="email" type="email">
<label>City *</label><input name="city" required>
<label>Full Address *</label><input name="address" required>
<label>Service *</label><select name="service" required><option value="">Select</option><option>Solar PV System</option><option>Hybrid Inverter System</option><option>BESS Battery Storage</option><option>EV Charging Setup</option><option>Electrical Engineering</option><option>Other</option></select>
<label>Capacity / Quantity</label><input name="capacity" placeholder="e.g. 10 kW">
<label>Preferred Date</label><input name="date" type="date">
<label>Order Details</label><textarea name="details" rows="3"></textarea>
<button id="b">Submit Order</button><div class="msg" id="m"></div></form></div>
<div class="card"><h2>Track Your Order</h2>
<label>Order ID</label><input id="tid" placeholder="THS-XXXXXX"><label>Phone used in order</label><input id="tph" type="tel">
<button type="button" id="tb">Check Status</button><div class="msg" id="tm"></div></div></div>
<script>
const $=id=>document.getElementById(id),f=$('f');
f.onsubmit=async e=>{e.preventDefault();const m=$('m');m.className='msg';$('b').disabled=true;
 try{const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});
 const d=await r.json();if(!r.ok)throw new Error(d.error);
 m.className='msg ok';m.textContent='Order placed! Your Order ID: '+d.id+' (save it to track status).';$('tid').value=d.id;$('tph').value=f.phone.value;f.reset();
 }catch(x){m.className='msg err';m.textContent=x.message||'Failed. Try again.'}$('b').disabled=false};
$('tb').onclick=async()=>{const m=$('tm');m.className='msg';
 try{const r=await fetch('/api/track?id='+encodeURIComponent($('tid').value)+'&phone='+encodeURIComponent($('tph').value));const d=await r.json();if(!r.ok)throw new Error(d.error);
 const c={pending:'#f59e0b',confirmed:'#16a34a',cancelled:'#dc2626'}[d.status];
 m.className='msg';m.style.display='block';m.style.background='#f8fafc';m.innerHTML='<span class="badge" style="background:'+c+'">'+d.status.toUpperCase()+'</span> '+d.service+(d.note?'<br>Note: '+d.note.replace(/</g,'&lt;'):'');
 }catch(x){m.removeAttribute('style');m.className='msg err';m.textContent=x.message}};
</script></body></html>
